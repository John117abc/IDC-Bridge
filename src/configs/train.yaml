_base: "base.yaml"

# ---- 环境配置 ----
env:
  num_worlds: 75
  max_agents: 1
  epochs: 1500
  seed: 5
  device: "cuda"

# ---- 路径/保存 ----
paths:
  file_dir: "/workspace/data"
  model_path: "/workspace/data/checkpoints/20260709/idc-waymo-v1.0_examples_121610_episode=290.pth"
  save_freq: 5
  load_model: false

# ---- 可视化/GIF 配置（训练默认关闭） ----
viz:
  gif_enabled: false
  gif_fps: 15
  gif_record_interval: 2
  gif_max_worlds: 10
  gif_save_dir: "/workspace/data/gifs"
  gif_world_selection: "first"     # "first" | "random"
  gif_view_mode: "agent_pov"     # "bird_2d" | "bird_3d" | "agent_pov"
  gif_zoom_radius: 70
  # 轨迹图落盘频率：原实现每个 epoch × 10 个 world，2400 轮会产 2.4 万张图
  traj_plot_interval: 50          # 每 N 个 epoch 存一次（第 1 轮总会存）
  traj_plot_max_worlds: 12        # 每次最多画几个 world（0 = 不画）；会额外拼一张蒙太奇
